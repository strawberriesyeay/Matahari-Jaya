<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | Matahari Jaya</title>

    <link rel="icon" type="image/png" href="images/logo.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/product-detail.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- NAVBAR -->

    <header>

        <div class="logo">

            <img src="images/logo.png" alt="Matahari Jaya Logo">

            <div class="logo-text">

                <h2>MATAHARI JAYA</h2>

                <span>
                    Terciptanya Keseimbangan Pangan
                </span>

            </div>

        </div>

        <nav>

            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>

        </nav>

        <a href="contact.html" class="btn-contact">
            Contact Us
        </a>

    </header>


    <!-- PRODUCT DETAIL -->

    <main class="product-detail">

        <div class="product-detail-container">

            <!-- IMAGE -->

            <div class="product-detail-image">

                <img id="productImage" src="" alt="Product">

            </div>


            <!-- INFORMATION -->

            <div class="product-detail-info">

                <span id="productCategory">
                    INDONESIAN SNACK
                </span>

                <h1 id="productName">
                    Product Name
                </h1>

                <p id="productDescription">
                    Product description.
                </p>


                <div class="product-information">

                <div>
                    <span>Composition</span>
                    <p id="productComposition"></p>
                </div>

                <div>
                    <span>Net Weight</span>
                    <p id="productWeight"></p>
                </div>

                <div>
                    <span>Shelf Life</span>
                    <p id="productShelfLife"></p>
                </div>

                <div>
                    <span>Origin</span>
                    <p id="productOrigin"></p>
                </div>

                <div>
                    <span>Packaging</span>
                    <p id="productPackaging"></p>
                </div>

                <div>
                    <span>Product Type</span>
                    <p id="productType"></p>
                </div>

                <div>
                    <span>PIRT Number</span>
                    <p id="productPirt"></p>
                </div>

                <div>
                    <span>Halal Certificate</span>
                    <p id="productHalal"></p>
                </div>

            </div>

                <a href="contact.html" class="product-contact-btn">
                    Contact Us
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

                <a href="products.html" class="back-products">
                    ← Back to Products
                </a>

            </div>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script src="js/product-detail.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
