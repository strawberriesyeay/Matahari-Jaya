/* ================= LANGUAGE MENU ================= */

document.addEventListener("DOMContentLoaded", function () {

    const languageButton = document.getElementById("languageButton");
    const languageMenu = document.getElementById("languageMenu");
    const currentLanguage = document.getElementById("currentLanguage");

    if (!languageButton || !languageMenu) return;


    /* BUKA / TUTUP MENU */

    languageButton.addEventListener("click", function (e) {

        e.stopPropagation();

        languageMenu.classList.toggle("active");

    });


    /* PILIH BAHASA */

    document.querySelectorAll(".language-menu button").forEach(function (button) {

        button.addEventListener("click", function (e) {

            e.stopPropagation();

            const language = this.dataset.lang;

            translatePage(language);

            currentLanguage.textContent =
                language === "id" ? "ID" : "EN";

            languageMenu.classList.remove("active");

        });

    });


    /* KLIK DI LUAR MENU */

    document.addEventListener("click", function () {

        languageMenu.classList.remove("active");

    });

});


/* ================= GOOGLE TRANSLATE ================= */

function translatePage(language) {

    const tryTranslate = setInterval(function () {

        const select = document.querySelector(".goog-te-combo");

        if (select) {

            select.value = language;

            select.dispatchEvent(
                new Event("change")
            );

            clearInterval(tryTranslate);

        }

    }, 300);


    setTimeout(function () {

        clearInterval(tryTranslate);

    }, 10000);

}


/* ================= GOOGLE TRANSLATE INIT ================= */

function googleTranslateElementInit() {

    new google.translate.TranslateElement({

        pageLanguage: "en",
        includedLanguages: "en,id",
        autoDisplay: false

    }, "google_translate_element");

}

</script>

<script>
/* =====================================================
   SCROLL REVEAL
===================================================== */

document.addEventListener("DOMContentLoaded", function () {

    const revealElements = document.querySelectorAll(
        "section > *, .product-card, .about-card, .vision-box, .mission-box, .gallery-video, .video-card"
    );

    revealElements.forEach(function (element) {
        element.classList.add("reveal");
    });


    function revealOnScroll() {

        const windowHeight = window.innerHeight;

        revealElements.forEach(function (element) {

            const elementTop =
                element.getBoundingClientRect().top;

            if (elementTop < windowHeight - 80) {

                element.classList.add("active");

            }

        });

    }


    window.addEventListener(
        "scroll",
        revealOnScroll,
        { passive: true }
    );


    revealOnScroll();

});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const menuToggle = document.getElementById("menuToggle");
    const nav = document.querySelector("nav");

    if (!menuToggle || !nav) return;

    menuToggle.addEventListener("click", function () {

        nav.classList.toggle("active");

        const icon = menuToggle.querySelector("i");

        if (nav.classList.contains("active")) {

            icon.classList.remove("fa-bars");
            icon.classList.add("fa-xmark");

        } else {

            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");

        }

    });


    // Tutup menu setelah memilih halaman

    nav.querySelectorAll("a").forEach(function (link) {

        link.addEventListener("click", function () {
            nav.classList.remove("active");

            const icon = menuToggle.querySelector("i");

            icon.classList.remove("fa-xmark");
            icon.classList.add("fa-bars");
        });

    });

});
</script>
